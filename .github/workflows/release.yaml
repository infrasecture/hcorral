name: Release launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact vMAJOR.MINOR.PATCH version
        required: true
        type: string
      channel:
        description: Release qualification channel
        required: true
        default: preview
        type: choice
        options: [preview, stable]
      prepared_run_id:
        description: Optional qualified run to resume without rebuilding or replacing published bytes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-launcher
  cancel-in-progress: false

jobs:
  prepare:
    name: release/prepare
    if: github.ref == 'refs/heads/main' && inputs.prepared_run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
      - env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: ./scripts/actions-release.sh prepare
      - id: prepared
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.version }}-${{ github.sha }}
          path: dist/
          retention-days: 30
      - env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          ARTIFACT_ID: ${{ steps.prepared.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.prepared.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.prepared.outputs.artifact-digest }}
        run: |
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires_at="$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)"
          # shellcheck disable=SC2153 # ARTIFACT_DIGEST is supplied by the step env.
          artifact_digest="$ARTIFACT_DIGEST"
          [[ "$artifact_digest" == sha256:* ]] || artifact_digest="sha256:${artifact_digest}"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid prepared artifact digest' >&2; exit 1; }
          {
            printf 'FORMAT=1\nVERSION=%s\nSOURCE_COMMIT=%s\n' "$VERSION" "$SOURCE_COMMIT"
            printf 'ARTIFACT_ID=%s\nARTIFACT_URL=%s\nARTIFACT_DIGEST=%s\n' "$ARTIFACT_ID" "$ARTIFACT_URL" "$artifact_digest"
            printf 'CREATED_AT=%s\nRETENTION_DAYS=30\nEXPIRES_AT=%s\n' "$created_at" "$expires_at"
          } >release-transport.env
          cat release-transport.env >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-transport-${{ github.sha }}
          path: release-transport.env
          retention-days: 30

  qualify-linux:
    name: release/linux-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.version }}-${{ github.sha }}
          path: dist
      - if: matrix.arch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y xvfb weston xwayland xauth x11-xserver-utils
      - env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          pkg_version="${VERSION#v}"
          package_root="$(mktemp -d)"
          trap 'rm -rf -- "${package_root}"' EXIT
          case '${{ matrix.arch }}' in
            amd64) rpm_arch=x86_64; arch_arch=x86_64 ;;
            arm64) rpm_arch=aarch64; arch_arch=aarch64 ;;
          esac
          docker run --rm -v "$PWD/dist:/packages:ro" ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 \
            sh -c "dpkg -i /packages/hcorral_${pkg_version}_linux_${{ matrix.arch }}.deb && hcorral version"
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814 \
            sh -c "rpm -i /packages/hcorral-${pkg_version}-1.${rpm_arch}.rpm && hcorral version"
          arch_package="dist/hcorral-${pkg_version}-1-${arch_arch}.pkg.tar.zst"
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            docker run --rm -v "$PWD/dist:/packages:ro" archlinux:base@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a \
              sh -c "pacman -U --noconfirm /packages/hcorral-${pkg_version}-1-${arch_arch}.pkg.tar.zst && hcorral version"
          else
            # Arch Linux's official container is amd64-only. Qualify the arm64
            # package natively without adding an unofficial image to the trust
            # chain: extract it as an isolated package root, verify metadata and
            # install layout, and execute the exact packaged binary.
            arch_root="${package_root}/arch"
            mkdir -p "${arch_root}"
            tar --zstd --extract --file "${arch_package}" --directory "${arch_root}"
            grep -Fxq 'arch = aarch64' "${arch_root}/.PKGINFO"
            test "$(stat -c '%a' "${arch_root}/usr/bin/hcorral")" = 755
            test -f "${arch_root}/usr/share/doc/hcorral/LICENSE"
            test -f "${arch_root}/usr/share/doc/hcorral/THIRD_PARTY_LICENSES.md"
            "${arch_root}/usr/bin/hcorral" version
          fi
          dpkg-deb --extract "dist/hcorral_${pkg_version}_linux_${{ matrix.arch }}.deb" "${package_root}/deb"
          chmod 0755 "dist/tests/session-transfer-linux-${{ matrix.arch }}"
          chmod 0755 "dist/tests/session-core-linux-${{ matrix.arch }}"
          suite=architecture
          if [[ '${{ matrix.arch }}' == amd64 ]]; then suite=linux; fi
          HCORRAL_TEST_BINARY="${package_root}/deb/usr/bin/hcorral" ./tests/run.sh "$suite"
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            HCORRAL_TEST_BINARY="${package_root}/deb/usr/bin/hcorral" ./tests/run.sh compat
          fi
      - env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          GATE: linux-${{ matrix.arch }}
        run: |
          state="dist/release-state/$VERSION/$SOURCE_COMMIT/release.env"
          artifacts_sha="$(sed -n 's/^ARTIFACTS_SHA256=//p' "$state")"
          ./scripts/release-qualification.sh --version "$VERSION" --source-commit "$SOURCE_COMMIT" --artifacts-sha256 "$artifacts_sha" --gate "$GATE" --status passed --output "dist/qualification/$GATE.env"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-linux-${{ matrix.arch }}-${{ github.sha }}
          path: dist/qualification/linux-${{ matrix.arch }}.env
          retention-days: 30

  qualify-darwin:
    name: release/darwin-artifacts
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.version }}-${{ github.sha }}
          path: dist
      - env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          ./tests/qualification/darwin-artifacts.sh "$VERSION"
          state="dist/release-state/$VERSION/$SOURCE_COMMIT/release.env"
          artifacts_sha="$(sed -n 's/^ARTIFACTS_SHA256=//p' "$state")"
          for arch in amd64 arm64; do
            ./scripts/release-qualification.sh --version "$VERSION" --source-commit "$SOURCE_COMMIT" --artifacts-sha256 "$artifacts_sha" --gate "darwin-$arch" --status artifact-checked --output "dist/qualification/darwin-$arch.env"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-darwin-${{ github.sha }}
          path: dist/qualification/darwin-*.env
          retention-days: 30

  qualify-linux-gui:
    name: release/${{ matrix.gate }}
    if: inputs.channel == 'stable'
    needs: prepare
    strategy:
      matrix:
        include:
          - gate: linux-x11
            mode: x11
            runner_label: hcorral-x11
          - gate: linux-wayland
            mode: wayland
            runner_label: hcorral-wayland
          - gate: linux-xwayland
            mode: x11
            runner_label: hcorral-xwayland
    runs-on: [self-hosted, Linux, "${{ matrix.runner_label }}"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.version }}-${{ github.sha }}
          path: dist
      - env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          GATE: ${{ matrix.gate }}
          GUI_MODE: ${{ matrix.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          arch="$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')"
          export HCORRAL_TEST_BINARY="$PWD/dist/bin/hcorral-linux-${arch}"
          chmod 0755 "$HCORRAL_TEST_BINARY"
          image_repository="hcorral-desktop-${GATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="${image_repository}:0.160.0-r1-${arch}"
          trap 'docker image rm "$image" "${image_repository}:0.160.0-r1" >/dev/null 2>&1 || true' EXIT
          HCORRAL_IMAGE_REPOSITORY="$image_repository" ./scripts/build-harness-image.sh \
            --harness codex --version 0.160.0 --revision 1 --arch "$arch"
          ./tests/qualification/linux-gui.sh "$GUI_MODE" "$image"
          state="dist/release-state/$VERSION/$SOURCE_COMMIT/release.env"
          artifacts_sha="$(sed -n 's/^ARTIFACTS_SHA256=//p' "$state")"
          ./scripts/release-qualification.sh --version "$VERSION" --source-commit "$SOURCE_COMMIT" --artifacts-sha256 "$artifacts_sha" --gate "$GATE" --status passed --output "dist/qualification/$GATE.env"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ matrix.gate }}-${{ github.sha }}
          path: dist/qualification/${{ matrix.gate }}.env
          retention-days: 30

  publish:
    name: release/publish
    needs: [prepare, qualify-linux, qualify-darwin, qualify-linux-gui]
    # Explicit result checks prevent skipped preview/recovery ancestors from
    # skipping publication. Recovery independently verifies the original jobs.
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (inputs.prepared_run_id != '' ||
       (needs.prepare.result == 'success' && needs.qualify-linux.result == 'success' &&
        needs.qualify-darwin.result == 'success' &&
        (needs.qualify-linux-gui.result == 'success' ||
         (inputs.channel == 'preview' && needs.qualify-linux-gui.result == 'skipped'))))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id || github.run_id }}
        run: ./scripts/actions-release.sh publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-ledger-${{ github.run_id }}
          path: dist/release-state/${{ inputs.version }}/*/publication-ledger.tsv
          retention-days: 90

  verify:
    name: release/verify
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          release_json="$(gh api "repos/infrasecture/hcorral/releases/tags/${VERSION}")"
          release_url="$(jq -r .html_url <<<"$release_json")"
          release_id="$(jq -r .id <<<"$release_json")"
          gh release download "$VERSION" --repo infrasecture/hcorral --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/release/hcorral_${VERSION#v}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/release" hcorral
          "$RUNNER_TEMP/release/hcorral" version
          tag_object="$(gh api "repos/infrasecture/hcorral/git/ref/tags/${VERSION}" --jq .object.sha)"
          tag_commit="$(gh api "repos/infrasecture/hcorral/git/tags/${tag_object}" --jq .object.sha)"
          source_commit="$(jq -r .commit "$RUNNER_TEMP/release/component-manifest.json")"
          [[ "$tag_commit" == "$source_commit" ]]
          {
            printf 'Release: %s (database ID %s)\n' "$release_url" "$release_id"
            printf 'Tag object: %s\nTag commit: %s\n' "$tag_object" "$tag_commit"
            printf 'Darwin archives validated; native macOS execution is not automated.\n'
            printf 'Homebrew is published separately by the tap repository workflow.\n'
          } >>"$GITHUB_STEP_SUMMARY"
