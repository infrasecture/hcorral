name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: ci/source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - run: ./scripts/ci-source.sh

  build:
    name: build/release-matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - run: ./build.sh --release --cli-version v0.0.0 --packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-release-matrix-${{ github.sha }}
          path: dist/
          retention-days: 7

  images:
    name: ci/image-${{ matrix.harness }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: codex
            arch: amd64
            runner: ubuntu-24.04
          - harness: codex
            arch: arm64
            runner: ubuntu-24.04-arm
          - harness: claude
            arch: amd64
            runner: ubuntu-24.04
          - harness: claude
            arch: arm64
            runner: ubuntu-24.04-arm
          - harness: pi
            arch: amd64
            runner: ubuntu-24.04
          - harness: pi
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - env:
          HARNESS: ${{ matrix.harness }}
          ARCH: ${{ matrix.arch }}
        run: |
          identity="$(./scripts/build-harness-image.sh --harness "$HARNESS" --revision auto --resolve-only)"
          version="$(sed -n 's/^version=//p' <<<"$identity")"
          revision="$(sed -n 's/^revision=//p' <<<"$identity")"
          ./scripts/build-harness-image.sh --harness "$HARNESS" --version "$version" --revision "$revision" --arch "$ARCH"
          image="ghcr.io/infrasecture/hcorral-${HARNESS}:${version}-r${revision}-${ARCH}"
          [[ "$(docker image inspect --format '{{.Architecture}}' "$image")" == "$ARCH" ]]
          ./tests/image/entrypoint-matrix.sh "$image"

  images-gate:
    name: ci/images
    if: always()
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.images.result }}' = success

  packages:
    name: ci/packages-${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            rpm_arch: x86_64
            arch_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rpm_arch: aarch64
            arch_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-release-matrix-${{ github.sha }}
          path: dist
      - run: |
          docker run --rm -v "$PWD/dist:/packages:ro" ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 \
            sh -c 'dpkg -i /packages/hcorral_0.0.0_linux_${{ matrix.arch }}.deb && hcorral version && dpkg -r hcorral && ! command -v hcorral'
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814 \
            sh -c 'rpm -i /packages/hcorral-0.0.0-1.${{ matrix.rpm_arch }}.rpm && hcorral version && rpm -e hcorral && ! command -v hcorral'
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            docker run --rm -v "$PWD/dist:/packages:ro" archlinux:base@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a \
              sh -c 'pacman -U --noconfirm /packages/hcorral-0.0.0-1-x86_64.pkg.tar.zst && hcorral version && pacman -R --noconfirm hcorral && ! command -v hcorral'
          else
            root="$(mktemp -d)"
            trap 'rm -rf -- "$root"' EXIT
            tar --zstd -xf 'dist/hcorral-0.0.0-1-aarch64.pkg.tar.zst' -C "$root"
            grep -Fxq 'arch = aarch64' "$root/.PKGINFO"
            "$root/usr/bin/hcorral" version
          fi

  packages-gate:
    name: ci/packages
    if: always()
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.packages.result }}' = success

  linux:
    name: ci/linux-${{ matrix.arch }}
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-release-matrix-${{ github.sha }}
          path: dist
      - run: |
          chmod 0755 "dist/bin/hcorral-linux-${{ matrix.arch }}"
          "dist/bin/hcorral-linux-${{ matrix.arch }}" version
      - if: matrix.arch == 'amd64'
        env:
          HCORRAL_TEST_BINARY: ${{ github.workspace }}/dist/bin/hcorral-linux-amd64
        run: ./tests/integration/run.sh

  linux-gate:
    name: ci/linux
    if: always()
    needs: [linux, compose-compat]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.linux.result }}' = success && test '${{ needs.compose-compat.result }}' = success

  compose-compat:
    name: ci/compose-2.24.6-${{ matrix.arch }}
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            compose_arch: x86_64
            sha256: eca30ae32dc451f9e6d6c8ddce078a76f23b355c3ca0ab391d58f59e87c0d310
          - runner: ubuntu-24.04-arm
            arch: arm64
            compose_arch: aarch64
            sha256: 05b91fcc38d80378508dc42e027fa71f13431bdd3247139e51fa084e95c3de9c
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-release-matrix-${{ github.sha }}
          path: dist
      - run: |
          compose="$RUNNER_TEMP/docker-compose"
          curl --fail --silent --show-error --location --output "$compose" \
            "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-${{ matrix.compose_arch }}"
          printf '%s  %s\n' '${{ matrix.sha256 }}' "$compose" | sha256sum --check --strict
          chmod 0755 "$compose" "dist/bin/hcorral-linux-${{ matrix.arch }}"
          export HCORRAL_COMPOSE_COMMAND="[\"$compose\"]"
          export HCORRAL_TEST_BINARY="$PWD/dist/bin/hcorral-linux-${{ matrix.arch }}"
          ./tests/integration/run.sh

  darwin:
    name: ci/darwin-${{ matrix.arch }}
    needs: build
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-release-matrix-${{ github.sha }}
          path: dist
      - run: |
          tar -xzf "dist/hcorral_0.0.0_darwin_${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/hcorral" version
          "$RUNNER_TEMP/hcorral" --help
          if "$RUNNER_TEMP/hcorral" --gui=x11 info; then
            echo 'macOS GUI request unexpectedly succeeded' >&2
            exit 1
          fi

  darwin-gate:
    name: ci/darwin
    if: always()
    needs: darwin
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.darwin.result }}' = success
